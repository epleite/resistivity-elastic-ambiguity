name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Restore frozen outputs from the archived v1.0.0 release
        shell: bash
        run: |
          archive="$RUNNER_TEMP/resistivity-elastic-ambiguity-v1.0.0.zip"
          archive_dir="$RUNNER_TEMP/resistivity-elastic-ambiguity-v1.0.0"
          curl -fsSL \
            https://github.com/epleite/resistivity-elastic-ambiguity/releases/download/v1.0.0/resistivity-elastic-ambiguity-v1.0.0.zip \
            -o "$archive"
          echo "5a4ba15ef8d115537a8889c80681d8fbc37381a2e4a76b24e6a5945766f7cce6  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$archive_dir"
          cp -a "$archive_dir/resistivity-elastic-ambiguity-1.0.0/outputs" .
          cp -a "$archive_dir/resistivity-elastic-ambiguity-1.0.0/manuscript_figures" .
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[reports,dev]"
      - name: Run unit and reproducibility tests
        run: python -m unittest discover -s tests -v
      - name: Verify frozen numerical artifacts
        run: python scripts/verify_frozen_outputs.py

  frozen-figure-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore frozen outputs from the archived v1.0.0 release
        shell: bash
        run: |
          archive="$RUNNER_TEMP/resistivity-elastic-ambiguity-v1.0.0.zip"
          archive_dir="$RUNNER_TEMP/resistivity-elastic-ambiguity-v1.0.0"
          curl -fsSL \
            https://github.com/epleite/resistivity-elastic-ambiguity/releases/download/v1.0.0/resistivity-elastic-ambiguity-v1.0.0.zip \
            -o "$archive"
          echo "5a4ba15ef8d115537a8889c80681d8fbc37381a2e4a76b24e6a5945766f7cce6  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$archive_dir"
          cp -a "$archive_dir/resistivity-elastic-ambiguity-1.0.0/outputs" .
          cp -a "$archive_dir/resistivity-elastic-ambiguity-1.0.0/manuscript_figures" .
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Regenerate manuscript figures from frozen tables
        run: python scripts/make_gmd_figures.py --output build/manuscript_figures
      - name: Check complete figure set
        run: test "$(find build/manuscript_figures -maxdepth 1 -name 'fig*.pdf' | wc -l)" -eq 7
